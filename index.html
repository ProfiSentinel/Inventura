<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Rychlá Inventura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root {
      --primary: #27ae60;
      --bg: #fdfbf7;
      --border: #ddd;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 0;
      margin: 0;
      background: var(--bg);
      font-size: 14px;
      color: #333;
    }
    header {
      padding: 1rem;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h2 { margin: 0; font-size: 18px; }
    
    .btn-group { display: flex; gap: 5px; }
    
    button {
      padding: 0.5rem 0.8rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .btn-copy { background: #3498db; color: white; }
    .btn-reset { background: #e74c3c; color: white; }
    .btn-add { background: var(--primary); color: white; width: 100%; margin-top: 2px;}

    .table-container {
      overflow-x: auto;
      padding-bottom: 60px; /* Space for footer/scroll */
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed; /* Fixed Layout for better mobile inputs */
    }
    th {
      background: #eee;
      position: sticky;
      top: 0; /* Sticky within container if logic allows, simplified here */
      font-size: 12px;
      padding: 8px 2px;
    }
    td {
      padding: 5px 2px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      vertical-align: middle;
    }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    /* Input Styling */
    input {
      width: 100%;
      max-width: 50px;
      padding: 8px 2px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px; /* Prevents zoom on iOS */
      -moz-appearance: textfield;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .item-name {
      font-size: 13px;
      text-align: left;
      padding-left: 8px;
      word-wrap: break-word;
    }
    
    .total-display {
      display: block;
      font-weight: bold;
      color: #555;
      font-size: 12px;
      margin-top: 2px;
      transition: color 0.3s, transform 0.2s;
    }
    .updated {
      color: var(--primary);
      transform: scale(1.2);
    }

    /* Col widths */
    col.c-name { width: 35%; }
    col.c-input { width: 18%; }
    col.c-action { width: 11%; }
  </style>
</head>
<body>

  <header>
    <h2>Inventura</h2>
    <div class="btn-group">
      <button class="btn-copy" onclick="copyToClipboard()">📋 Kopírovat</button>
      <button class="btn-reset" onclick="resetInventory()">🗑️ Reset</button>
    </div>
  </header>

  <div class="table-container">
    <table>
      <colgroup>
        <col class="c-name">
        <col class="c-input">
        <col class="c-input">
        <col class="c-input">
        <col class="c-action">
      </colgroup>
      <thead>
        <tr>
          <th>Položka</th>
          <th>Bal.</th>
          <th>Sáč.</th>
          <th>Kusy</th>
          <th>+</th>
        </tr>
      </thead>
      <tbody id="inventoryTable">
        </tbody>
    </table>
  </div>

  <script>
    const itemList = [
      "4:1", "10:1", "Filet-O-Fish", "Slanina dlouha", "Slaninové kousky",
      "Tasticka jablko", "Tasticka boruvka", "English muffin", "Pork maso",
      "Hashbrown", "Tortilla 20cm", "Tortilla 25cm", "Kureci Nuggety(15s)",
      "Hermelínky", "Smaž. sýr", "Rosti patty", "Grill kureci(12s)",
      "Value maso", "McCrispy maso", "Stripsy(21s)", "Premiere", "Hranolky",
      "Omacka Quaca", "QP", "Sýr slanina žemle", "Crispy zemle", "BM", "RG",
      "Rucola", "Cibule cerstva", "Rajcata krajena", "Salat.smes", "Batavia",
      "Shake", "Sundae", "Str.cheddar", "Ched.platky", "Sýr white ched.",
      "Vejce", "Salat BM", "Friends-collect", "Káva", "Mléko 3,5%"
    ];

    let inventory = JSON.parse(localStorage.getItem("inventoryData_v2")) || {};

    // Inicializace dat
    itemList.forEach(item => {
      if (!inventory[item]) inventory[item] = { pack: 0, bag: 0, pcs: 0 };
    });

    const tbody = document.getElementById("inventoryTable");

    // Vykreslení tabulky
    itemList.forEach(item => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td class="item-name"><strong>${item}</strong></td>
        <td>
          <input type="number" inputmode="decimal" id="${item}-pack" placeholder="">
          <span class="total-display" id="${item}-pack-total">0</span>
        </td>
        <td>
          <input type="number" inputmode="decimal" id="${item}-bag" placeholder="">
          <span class="total-display" id="${item}-bag-total">0</span>
        </td>
        <td>
          <input type="number" inputmode="decimal" id="${item}-pcs" placeholder="">
          <span class="total-display" id="${item}-pcs-total">0</span>
        </td>
        <td><button class="btn-add" onclick="updateItem('${item}')">OK</button></td>
      `;
      tbody.appendChild(row);

      // Přidání Listeneru pro Enter v inputech
      [`${item}-pack`, `${item}-bag`, `${item}-pcs`].forEach(id => {
        document.getElementById(id).addEventListener("keypress", function(event) {
          if (event.key === "Enter") {
            event.preventDefault();
            updateItem(item);
            // Volitelně: přesunout focus na další input?
          }
        });
      });
    });

    function updateItem(item) {
      const inputs = ['pack', 'bag', 'pcs'];
      let changed = false;

      inputs.forEach(type => {
        const inputEl = document.getElementById(`${item}-${type}`);
        const val = parseFloat(inputEl.value);
        
        if (!isNaN(val) && val !== 0) {
          inventory[item][type] += val;
          // Ošetření záporných hodnot (aby nešlo pod nulu, pokud to není chtěné - volitelné)
          // if(inventory[item][type] < 0) inventory[item][type] = 0; 
          
          inputEl.value = ""; // Vymazat input
          highlightChange(`${item}-${type}-total`);
          changed = true;
        }
      });

      if (changed) {
        localStorage.setItem("inventoryData_v2", JSON.stringify(inventory));
        updateDisplay(item);
      }
    }

    function updateDisplay(item) {
      document.getElementById(`${item}-pack-total`).textContent = inventory[item].pack;
      document.getElementById(`${item}-bag-total`).textContent = inventory[item].bag;
      document.getElementById(`${item}-pcs-total`).textContent = inventory[item].pcs;
    }

    function highlightChange(elementId) {
      const el = document.getElementById(elementId);
      el.classList.add("updated");
      setTimeout(() => el.classList.remove("updated"), 500);
    }

    function resetInventory() {
      if (confirm("Opravdu chceš smazat všechna data a začít od nuly?")) {
        itemList.forEach(item => {
          inventory[item] = { pack: 0, bag: 0, pcs: 0 };
          updateDisplay(item);
        });
        localStorage.setItem("inventoryData_v2", JSON.stringify(inventory));
      }
    }

    function copyToClipboard() {
      let text = "INVENTURA:\n\n";
      let hasData = false;
      
      itemList.forEach(item => {
        const i = inventory[item];
        if (i.pack > 0 || i.bag > 0 || i.pcs > 0) {
          text += `${item}: ${i.pack} bal | ${i.bag} sáč | ${i.pcs} ks\n`;
          hasData = true;
        }
      });

      if (!hasData) text += "Žádná data.";

      navigator.clipboard.writeText(text).then(() => {
        alert("Zkopírováno do schránky! Nyní můžeš vložit (Ctrl+V) do mailu nebo zprávy.");
      }).catch(err => {
        alert("Chyba kopírování: " + err);
      });
    }

    // Načtení hodnot při startu
    itemList.forEach(updateDisplay);
  </script>

</body>
</html>
