<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Inventura: Denní/Týdenní/Pondělí/Středa/Čtvrtek</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css"> 
</head>
<body class="mode-add">

  <header>
    <div class="list-tabs">
      <button class="tab-btn active" id="tab-daily" onclick="switchListType('daily')">DENNÍ</button>
      <button class="tab-btn" id="tab-weekly" onclick="switchListType('weekly')">TÝDENNÍ</button>
      <button class="tab-btn" id="tab-monday" onclick="switchListType('monday')">PONDĚLÍ</button>
      <button class="tab-btn" id="tab-wednesday" onclick="switchListType('wednesday')">STŘEDA</button>
      <button class="tab-btn" id="tab-thursday" onclick="switchListType('thursday')">ČTVRTEK</button>
    </div>

    <div class="header-info-row">
      <h2 id="pageTitle">Denní inventura</h2>
      <div class="header-controls">
        <button class="ctrl-btn btn-edit" onclick="openEditListModal()">
          <i class="fas fa-edit"></i> Seznam
        </button>
        <button class="ctrl-btn btn-reset" onclick="resetInventory()">
          <i class="fas fa-sync-alt"></i> Reset
        </button>
      </div>
    </div>
  </header>

  <div id="sticky-wrapper">
    <div class="sticky-inner-content">
      <div id="searchBar">
        <div class="search-input-wrapper">
          <i class="fas fa-search search-icon-left"></i>
          <input type="text" id="searchInput" placeholder="Hledat položku..." autocomplete="off">
          <button class="search-close" onclick="closeSearch()"><i class="fas fa-times"></i></button>
        </div>
      </div>

      <div class="mode-switch">
        <div class="mode-btn mode-add-btn" onclick="setMode('add')">
          <i class="fas fa-plus"></i> PŘIDAT
        </div>
        <div class="mode-btn mode-sub-btn" onclick="setMode('sub')">
          <i class="fas fa-minus"></i> ODEČÍST
        </div>
      </div>
    </div>
  </div>

  <div class="table-container">
    <table>
      <colgroup>
        <col class="c-name">
        <col class="c-input">
        <col class="c-input">
        <col class="c-input">
        <col class="c-action">
      </colgroup>
      <thead>
        <tr>
          <th>Položka</th>
          <th>Bal.</th>
          <th>Sáč.</th>
          <th>Kusy</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="inventoryTable"></tbody>
    </table>
  </div>

  <div class="fab-search" onclick="toggleSearch()">
    <i class="fas fa-search"></i>
  </div>

  <div id="listModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span id="editModalTitle">Editace seznamu</span>
        <button class="modal-close-btn" onclick="document.getElementById('listModal').style.display='none'">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <textarea id="itemsTextarea"></textarea>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="document.getElementById('listModal').style.display='none'">Zrušit</button>
        <button class="btn-save" onclick="saveNewList()"><i class="fas fa-save"></i> ULOŽIT</button>
      </div>
    </div>
  </div>

  <div id="historyModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span id="historyTitle">Historie</span>
        <button class="modal-close-btn" onclick="document.getElementById('historyModal').style.display='none'">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div style="font-size: 12px; color: #777; margin-bottom: 5px;">Klikni na číslo pro úpravu.</div>
      <div id="historyContainer" class="history-list"></div>
      <div class="modal-footer">
        <button class="btn-cancel" style="width:100%" onclick="document.getElementById('historyModal').style.display='none'">Zavřít</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
