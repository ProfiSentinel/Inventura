<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Inventura pro PC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #27ae60;
      --bg: #f4f4f4;
      --border: #ccc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 0;
      margin: 0;
      background: var(--bg);
      color: #333;
    }
    header {
      padding: 1rem;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h2 { margin: 0; font-size: 20px; color: var(--primary); }
    
    button.btn-reset {
      background: #c0392b;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .table-container {
      padding-bottom: 50px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th {
      background: #e2e6ea;
      position: sticky;
      top: 0;
      font-size: 13px;
      padding: 10px 2px;
      color: #555;
      border-bottom: 2px solid #bdc3c7;
    }
    td {
      padding: 8px 4px;
      border-bottom: 1px solid #ddd;
      text-align: center;
      vertical-align: middle;
    }
    /* Zebra pruhování pro lepší orientaci v řádcích */
    tr:nth-child(even) { background-color: #fff; }
    tr:nth-child(odd) { background-color: #f1f2f6; }
    
    /* Vstupní pole */
    input {
      width: 100%;
      max-width: 60px;
      padding: 8px 0;
      text-align: center;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 16px;
      background: #fff;
    }
    input:focus {
      border-color: var(--accent);
      outline: none;
      background: #e8f8f5;
    }

    /* Názvy položek */
    .item-name {
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      padding-left: 10px;
      color: var(--primary);
    }
    
    /* Zobrazení součtů - ZVĚTŠENO PRO SNADNÉ OPISOVÁNÍ */
    .total-display {
      display: block;
      font-weight: 800;
      color: var(--primary);
      font-size: 18px; /* Velké číslo */
      margin-top: 4px;
    }
    
    /* Zvýraznění při změně */
    .updated {
      color: var(--accent);
      transform: scale(1.3);
      transition: transform 0.2s, color 0.2s;
    }

    /* Tlačítko OK */
    .btn-ok {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px;
      width: 100%;
      font-weight: bold;
    }

    /* Nastavení šířky sloupců */
    col.c-name { width: 34%; }
    col.c-input { width: 18%; }
    col.c-action { width: 12%; }
  </style>
</head>
<body>

  <header>
    <h2>Inventura</h2>
    <button class="btn-reset" onclick="resetInventory()">Nová inventura (Reset)</button>
  </header>

  <div class="table-container">
    <table>
      <colgroup>
        <col class="c-name">
        <col class="c-input">
        <col class="c-input">
        <col class="c-input">
        <col class="c-action">
      </colgroup>
      <thead>
        <tr>
          <th>Položka</th>
          <th>Bal.</th>
          <th>Sáč.</th>
          <th>Kusy</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="inventoryTable">
        </tbody>
    </table>
  </div>

  <script>
    const itemList = [
      "4:1", "10:1", "Filet-O-Fish", "Slanina dlouha", "Slaninové kousky",
      "Tasticka jablko", "Tasticka boruvka", "English muffin", "Pork maso",
      "Hashbrown", "Tortilla 20cm", "Tortilla 25cm", "Kureci Nuggety(15s)",
      "Hermelínky", "Smaž. sýr", "Rosti patty", "Grill kureci(12s)",
      "Value maso", "McCrispy maso", "Stripsy(21s)", "Premiere", "Hranolky",
      "Omacka Quaca", "QP", "Sýr slanina žemle", "Crispy zemle", "BM", "RG",
      "Rucola", "Cibule cerstva", "Rajcata krajena", "Salat.smes", "Batavia",
      "Shake", "Sundae", "Str.cheddar", "Ched.platky", "Sýr white ched.",
      "Vejce", "Salat BM", "Friends-collect", "Káva", "Mléko 3,5%"
    ];

    let inventory = JSON.parse(localStorage.getItem("inventory_simple")) || {};

    // Inicializace
    itemList.forEach(item => {
      if (!inventory[item]) inventory[item] = { pack: 0, bag: 0, pcs: 0 };
    });

    const tbody = document.getElementById("inventoryTable");

    itemList.forEach(item => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td class="item-name">${item}</td>
        <td>
          <input type="number" inputmode="decimal" id="${item}-pack" placeholder="">
          <span class="total-display" id="${item}-pack-total">0</span>
        </td>
        <td>
          <input type="number" inputmode="decimal" id="${item}-bag" placeholder="">
          <span class="total-display" id="${item}-bag-total">0</span>
        </td>
        <td>
          <input type="number" inputmode="decimal" id="${item}-pcs" placeholder="">
          <span class="total-display" id="${item}-pcs-total">0</span>
        </td>
        <td><button class="btn-ok" onclick="updateItem('${item}')">OK</button></td>
      `;
      tbody.appendChild(row);

      // Enter key support
      [`${item}-pack`, `${item}-bag`, `${item}-pcs`].forEach(id => {
        document.getElementById(id).addEventListener("keypress", function(event) {
          if (event.key === "Enter") {
            event.preventDefault();
            updateItem(item);
          }
        });
      });
    });

    function updateItem(item) {
      const inputs = ['pack', 'bag', 'pcs'];
      let changed = false;

      inputs.forEach(type => {
        const inputEl = document.getElementById(`${item}-${type}`);
        const val = parseFloat(inputEl.value);
        
        if (!isNaN(val) && val !== 0) {
          inventory[item][type] += val;
          inputEl.value = ""; // Vymazat po zadání
          highlightChange(`${item}-${type}-total`);
          changed = true;
        }
      });

      if (changed) {
        localStorage.setItem("inventory_simple", JSON.stringify(inventory));
        updateDisplay(item);
      }
    }

    function updateDisplay(item) {
      document.getElementById(`${item}-pack-total`).textContent = inventory[item].pack;
      document.getElementById(`${item}-bag-total`).textContent = inventory[item].bag;
      document.getElementById(`${item}-pcs-total`).textContent = inventory[item].pcs;
    }

    function highlightChange(elementId) {
      const el = document.getElementById(elementId);
      el.classList.add("updated");
      setTimeout(() => el.classList.remove("updated"), 500);
    }

    function resetInventory() {
      if (confirm("Opravdu smazat všechna data?")) {
        itemList.forEach(item => {
          inventory[item] = { pack: 0, bag: 0, pcs: 0 };
          updateDisplay(item);
        });
        localStorage.setItem("inventory_simple", JSON.stringify(inventory));
      }
    }

    itemList.forEach(updateDisplay);
  </script>
</body>
</html>
