<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Inventura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      padding: 0.5rem;
      background: #faf8ed;
      font-size: 14px;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: center;
      padding: 0.3rem;
      border: 1px solid #ccc;
      font-size: 13px;
    }
    input {
      text-align: center;
      width: 60px;
      font-size: 13px;
      padding: 0.2rem;
    }
    small {
      display: block;
      font-size: 11px;
      margin-top: 2px;
    }
    button {
      padding: 0.3rem 0.6rem;
      font-size: 13px;
      border-radius: 4px;
      border: none;
    }
    #resetBtn {
      margin-top: 1rem;
      background: #e74c3c;
      color: white;
      font-weight: bold;
      width: 100%;
    }
  </style>
</head>
<body>

  <h2>Inventura</h2>

  <table>
    <thead>
      <tr>
        <th>Položka</th>
        <th>Balení</th>
        <th>Sáčky</th>
        <th>Kusy</th>
        <th>Akce</th>
      </tr>
    </thead>
    <tbody id="inventoryTable">
      <!-- řádky budou vygenerovány -->
    </tbody>
  </table>

  <button id="resetBtn" onclick="resetInventory()">🔄 RESET</button>

  <script>
    const itemList = ["Rajčata", "Papriky", "Okurky"];
    let inventory = JSON.parse(localStorage.getItem("inventoryData")) || {};

    itemList.forEach(item => {
      if (!inventory[item]) inventory[item] = { pack: 0, bag: 0, pcs: 0 };
    });

    const tbody = document.getElementById("inventoryTable");

    itemList.forEach(item => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td><strong>${item}</strong></td>
        <td>
          <input type="number" step="any" id="${item}-pack" placeholder=""><br>
          <small id="${item}-pack-total">0</small>
        </td>
        <td>
          <input type="number" step="any" id="${item}-bag" placeholder=""><br>
          <small id="${item}-bag-total">0</small>
        </td>
        <td>
          <input type="number" step="any" id="${item}-pcs" placeholder=""><br>
          <small id="${item}-pcs-total">0</small>
        </td>
        <td><button onclick="updateItem('${item}')">Vložit</button></td>
      `;
      tbody.appendChild(row);
    });

    function updateItem(item) {
      const pack = parseFloat(document.getElementById(`${item}-pack`).value) || 0;
      const bag = parseFloat(document.getElementById(`${item}-bag`).value) || 0;
      const pcs = parseFloat(document.getElementById(`${item}-pcs`).value) || 0;

      inventory[item].pack += pack;
      inventory[item].bag += bag;
      inventory[item].pcs += pcs;

      localStorage.setItem("inventoryData", JSON.stringify(inventory));
      updateDisplay(item);

      document.getElementById(`${item}-pack`).value = "";
      document.getElementById(`${item}-bag`).value = "";
      document.getElementById(`${item}-pcs`).value = "";
    }

    function updateDisplay(item) {
      document.getElementById(`${item}-pack-total`).textContent = inventory[item].pack;
      document.getElementById(`${item}-bag-total`).textContent = inventory[item].bag;
      document.getElementById(`${item}-pcs-total`).textContent = inventory[item].pcs;
    }

    function resetInventory() {
      if (confirm("Opravdu chceš resetovat všechny položky?")) {
        itemList.forEach(item => {
          inventory[item] = { pack: 0, bag: 0, pcs: 0 };
          updateDisplay(item);
        });
        localStorage.setItem("inventoryData", JSON.stringify(inventory));
      }
    }

    itemList.forEach(updateDisplay);
  </script>

</body>
</html>
